<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NIDS Live Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
    <h1>🛡️ Real-Time Network Intrusion Detection System</h1>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px;">
      <a href="{{ url_for('export_csv', table='traffic') }}" style="color: #5ad1a3; text-decoration: none;">📥 Export Traffic CSV</a>
      <a href="{{ url_for('export_csv', table='alerts') }}" style="color: #5ad1a3; text-decoration: none;">📥 Export Alerts CSV</a>
      <a href="{{ url_for('pdf') }}" style="color: #5ad1a3; text-decoration: none;">📄 PDF Report</a>
      <form method="POST" action="{{ url_for('logout') }}" style="margin: 0;">
        <input type="hidden" name="csrf" value="{{ session.csrf }}">
        <button type="submit" style="background: #2a2e3a; border: 1px solid #3d4253; color: #e6e6e6; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Sign Out</button>
      </form>
    </div>
  </header>

  <section class="stats">
    <div class="card">
      <h3 id="stat-packets">0</h3>
      <p>Packets Captured</p>
    </div>
    <div class="card">
      <h3 id="stat-alerts">0</h3>
      <p>Alerts Raised</p>
    </div>
    <div class="card">
      <h3 id="stat-blocked">0</h3>
      <p>IPs Blocked</p>
    </div>
  </section>

  <section class="chart-container">
    <canvas id="trafficChart"></canvas>
  </section>

  <section class="tables">
    <div class="table-wrap">
      <h2>Recent Alerts</h2>
      <table id="alerts-table">
        <thead>
          <tr><th>Time</th><th>Source IP</th><th>Attack Type</th><th>Confidence</th><th>Blocked</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="table-wrap">
      <h2>Recent Traffic</h2>
      <table id="traffic-table">
        <thead>
          <tr><th>Time</th><th>Src IP</th><th>Dst IP</th><th>Proto</th><th>Label</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
