<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NIDS Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .login-card {
      background: #1a1d27;
      border: 1px solid #2a2e3a;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .login-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #e6e6e6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .login-card p.subtitle {
      margin: 0 0 24px;
      color: #9aa0ac;
      font-size: 13px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #9aa0ac;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: #0f1117;
      border: 1px solid #2a2e3a;
      border-radius: 6px;
      color: #e6e6e6;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #5ad1a3;
    }
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #5ad1a3;
      border: none;
      border-radius: 6px;
      color: #0f1117;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      opacity: 0.9;
    }
    .alert-error {
      background: rgba(239, 97, 97, 0.15);
      border: 1px solid #ef6161;
      color: #ef6161;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 13px;
    }
    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }
    .hint code {
      background: #0f1117;
      padding: 2px 6px;
      border-radius: 4px;
      color: #9aa0ac;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2>🛡️ NIDS Portal</h2>
      <p class="subtitle">Sign in to manage and view detection activity</p>

      {% if error %}
        <div class="alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf" value="{{ session.csrf }}">
        
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div class="hint">
        Create an account via:<br>
        <code>flask --app app create-admin</code>
      </div>
    </div>
  </div>
</body>
</html>
